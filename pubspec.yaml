name: teamsync
description: Team Calendar App with continuous background alarm that overrides silent mode.
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_database: ^10.4.9
  audioplayers: ^5.2.1
  flutter_ringtone_player: ^3.2.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  vibration: ^1.8.4
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
